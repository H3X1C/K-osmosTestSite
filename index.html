<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>K-OSMOS — Crystal Planet Reveal</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      opacity: .75;
      transition: opacity .3s ease;
    }
    .hud:hover { opacity: 1; }
    .title {
      letter-spacing: .24em;
      font-size: 11px;
      text-transform: uppercase;
      color: rgba(150, 245, 255, .9);
      text-shadow: 0 0 16px rgba(0, 220, 255, .55);
    }
    .status {
      align-self: flex-end;
      font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: .12em;
      color: rgba(190, 245, 255, .65);
      text-transform: uppercase;
      text-align: right;
    }
    .error {
      position: fixed;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      max-width: min(680px, calc(100vw - 40px));
      padding: 20px;
      background: rgba(5, 8, 14, .94);
      border: 1px solid rgba(0, 220, 255, .45);
      color: #d8fbff;
      font: 12px/1.6 ui-monospace, monospace;
      white-space: pre-wrap;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <canvas id="canvas" aria-label="Animated K-OSMOS crystal planet shader"></canvas>

  <div class="hud">
    <div class="title">K-OSMOS // Crystal Planet Reveal</div>
    <div class="status" id="status">WEBGL // INITIALISING</div>
  </div>
  <pre class="error" id="error"></pre>

  <script>
    "use strict";

    const canvas = document.getElementById("canvas");
    const status = document.getElementById("status");
    const errorBox = document.getElementById("error");

    const gl = canvas.getContext("webgl", {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false,
      powerPreference: "high-performance"
    });

    if (!gl) {
      errorBox.textContent = "WebGL is not available in this browser/device.";
      errorBox.style.display = "block";
      status.textContent = "WEBGL // UNAVAILABLE";
      throw new Error("WebGL unavailable");
    }

    const vertexSource = `
      attribute vec2 aPosition;
      void main() {
        gl_Position = vec4(aPosition, 0.0, 1.0);
      }
    `;

    const fragmentSource = `
      precision highp float;

      uniform vec2 iResolution;
      uniform float iTime;

      float hash(vec2 p) {
          return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
      }

      // Crystal pillars repeated across the alien landscape.
      float map(vec3 p) {
          vec3 q = p;

          vec2 grid = floor(q.xz * 0.4);
          q.xz = mod(q.xz, 2.5) - 1.25;

          float h = hash(grid) * 3.0 + 1.0;

          // Crystal/prism body.
          float d = length(q.xz) - 0.2 * (1.0 - q.y * 0.1);
          d = max(d, q.y - h);
          d = max(d, -q.y);

          return d;
      }

      void mainImage(out vec4 fragColor, in vec2 fragCoord) {
          vec2 uv = (fragCoord.xy * 2.0 - iResolution.xy) / iResolution.y;

          // Slow forward flight over the metallic sea.
          vec3 ro = vec3(0.0, 1.5, iTime * 1.5);
          vec3 rd = normalize(vec3(uv, 1.2));

          // Gentle camera sway.
          float a = sin(iTime * 0.2) * 0.1;
          rd.xy *= mat2(cos(a), -sin(a), sin(a), cos(a));

          vec3 col = vec3(0.0);

          // --- SKY & GIANT PLANET ---
          float dSun = length(uv - vec2(0.5, 0.5));

          // Planet halo.
          col += vec3(0.2, 0.4, 1.0) * pow(0.3 / max(dSun, 0.001), 2.0);

          // Planet core with animated rings.
          if (dSun < 0.4) {
              float rings = sin(dSun * 100.0 - iTime * 2.0);
              col = mix(
                  vec3(0.1, 0.0, 0.2),
                  vec3(0.0, 0.8, 1.0),
                  rings * 0.5 + 0.5
              );
          }

          // --- RAYMARCHING: CRYSTALS ---
          float t = 0.0;

          for (int i = 0; i < 96; i++) {
              vec3 p = ro + rd * t;
              float h = map(p);

              if (h < 0.001 || t > 50.0) break;
              t += h;
          }

          if (t < 50.0) {
              vec3 p = ro + rd * t;

              // Simple edge shading.
              float edge = smoothstep(0.0, 0.1, map(p + 0.1));

              col = mix(
                  vec3(0.0, 0.1, 0.3),
                  vec3(0.0, 1.0, 1.0),
                  1.0 - edge
              );

              // Cyber-gold highlights.
              col += vec3(1.0, 0.8, 0.0) * pow(1.0 - edge, 10.0);

              // Distance fog.
              col = mix(
                  col,
                  vec3(0.0),
                  1.0 - exp(-0.05 * t)
              );
          } else {
              // Mercury sea.
              if (rd.y < 0.0) {
                  float dist = -ro.y / rd.y;
                  vec2 surf = ro.xz + rd.xz * dist;

                  float ripples =
                      sin(surf.x * 5.0 + iTime) *
                      cos(surf.y * 5.0 + iTime);

                  col = vec3(0.05, 0.1, 0.2) + ripples * 0.05;

                  // Scanlines across the water.
                  col *= 0.8 + 0.2 * sin(surf.y * 20.0);
              }
          }

          // Post-process: scanlines + vignette.
          col *= 0.9 + 0.1 * sin(fragCoord.y * 1.5);
          col *= 1.0 - length(uv) * 0.3;

          // Mild HDR-style tonemapping for a cleaner fullscreen result.
          col = 1.0 - exp(-col * 1.15);

          fragColor = vec4(col, 1.0);
      }

      void main() {
          mainImage(gl_FragColor, gl_FragCoord.xy);
      }
    `;

    function compileShader(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);

      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const log = gl.getShaderInfoLog(shader) || "Unknown shader compilation error.";
        gl.deleteShader(shader);
        throw new Error(log);
      }
      return shader;
    }

    function createProgram(vertex, fragment) {
      const program = gl.createProgram();
      gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vertex));
      gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fragment));
      gl.linkProgram(program);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const log = gl.getProgramInfoLog(program) || "Unknown program link error.";
        gl.deleteProgram(program);
        throw new Error(log);
      }
      return program;
    }

    let program;
    try {
      program = createProgram(vertexSource, fragmentSource);
    } catch (err) {
      errorBox.textContent = "Shader compilation failed:\\n\\n" + err.message;
      errorBox.style.display = "block";
      status.textContent = "WEBGL // SHADER ERROR";
      throw err;
    }

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);

    // One fullscreen triangle.
    gl.bufferData(
      gl.ARRAY_BUFFER,
      new Float32Array([
        -1, -1,
         3, -1,
        -1,  3
      ]),
      gl.STATIC_DRAW
    );

    const positionLocation = gl.getAttribLocation(program, "aPosition");
    const resolutionLocation = gl.getUniformLocation(program, "iResolution");
    const timeLocation = gl.getUniformLocation(program, "iTime");

    gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.enableVertexAttribArray(positionLocation);
    gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
      const height = Math.max(1, Math.floor(canvas.clientHeight * dpr));

      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }

      gl.viewport(0, 0, canvas.width, canvas.height);
    }

    window.addEventListener("resize", resize, { passive: true });

    const start = performance.now();

    function render(now) {
      resize();

      const time = (now - start) * 0.001;

      gl.useProgram(program);
      gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
      gl.uniform1f(timeLocation, time);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      requestAnimationFrame(render);
    }

    status.textContent =
      "WEBGL // LIVE // " +
      Math.round(window.devicePixelRatio || 1) + "X";

    requestAnimationFrame(render);
  </script>
</body>
</html>
