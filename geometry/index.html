<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>K-OSMOS — Infinite Geometry</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;position:fixed;inset:0}
.label{position:fixed;top:22px;left:24px;color:rgba(130,220,255,.72);font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.22em;text-transform:uppercase;pointer-events:none;text-shadow:0 0 14px #007fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="label">K-OSMOS // INFINITE GEOMETRY</div>
<script>
const canvas=document.getElementById("c");
const gl=canvas.getContext("webgl",{antialias:false,alpha:false,powerPreference:"high-performance"});
if(!gl) throw new Error("WebGL is not supported.");

const vertex=`
attribute vec2 position;
void main(){gl_Position=vec4(position,0.0,1.0);}
`;

const fragment=`
precision highp float;
uniform vec2 iResolution;
uniform float iTime;

float sdSphere(vec3 pos,float size){return length(pos)-size;}

float sdBox(vec3 pos,vec3 size){
    pos=abs(pos)-vec3(size);
    return max(max(pos.x,pos.y),pos.z);
}

float sdOctahedron(vec3 p,float s){
    p=abs(p);
    float m=p.x+p.y+p.z-s;
    vec3 q;
    if(3.0*p.x<m) q=p.xyz;
    else if(3.0*p.y<m) q=p.yzx;
    else if(3.0*p.z<m) q=p.zxy;
    else return m*0.57735027;

    float k=clamp(0.5*(q.z-q.y+s),0.0,s);
    return length(vec3(q.x,q.y-s+k,q.z-k));
}

float sdPlane(vec3 pos){return pos.y;}

mat2 rotate(float a){
    float s=sin(a);
    float c=cos(a);
    return mat2(c,s,-s,c);
}

vec3 repeat(vec3 pos,vec3 span){
    return abs(mod(pos,span))-span*0.5;
}

float getDistance(vec3 pos,vec2 uv){
    vec3 originalPos=pos;

    for(int i=0;i<3;i++){
        pos=abs(pos)-4.5;
        pos.xz*=rotate(1.0);
        pos.yz*=rotate(1.0);
    }

    pos=repeat(pos,vec3(4.0));

    float d0=abs(originalPos.x)-0.1;
    float d1=sdBox(pos,vec3(0.8));

    pos.xy*=rotate(mix(1.0,2.0,abs(sin(iTime))));
    float size=mix(1.1,1.3,abs(uv.y)*abs(uv.x));
    float d2=sdSphere(pos,size);
    float dd2=sdOctahedron(pos,1.8);
    float ddd2=mix(d2,dd2,abs(sin(iTime)));

    return max(max(d1,-ddd2),-d0);
}

void mainImage(out vec4 fragColor,vec2 fragCoord){
    vec2 p=(fragCoord.xy*2.0-iResolution.xy)/min(iResolution.x,iResolution.y);

    vec3 cameraOrigin=vec3(0.0,0.0,-10.0+iTime*4.0);
    vec3 cameraTarget=vec3(
        cos(iTime)+sin(iTime/2.0)*10.0,
        exp(sin(iTime))*2.0,
        3.0+iTime*4.0
    );

    vec3 upDirection=vec3(0.0,1.0,0.0);
    vec3 cameraDir=normalize(cameraTarget-cameraOrigin);

    // Stable camera-right vector based on camera direction.
    vec3 cameraRight=normalize(cross(upDirection,cameraDir));
    vec3 cameraUp=cross(cameraDir,cameraRight);

    vec3 rayDirection=normalize(
        cameraRight*p.x+cameraUp*p.y+cameraDir
    );

    float depth=0.0;
    float ac=0.0;
    vec3 rayPos=vec3(0.0);
    float d=0.0;

    for(int i=0;i<80;i++){
        rayPos=cameraOrigin+rayDirection*depth;
        d=getDistance(rayPos,p);

        if(abs(d)<0.0001) break;

        ac+=exp(-d*mix(5.0,10.0,abs(sin(iTime))));
        depth+=d;

        if(depth>100.0) break;
    }

    vec3 col=vec3(0.0,0.3,0.7);

    ac*=1.2*(iResolution.x/iResolution.y-abs(p.x));

    vec3 finalCol=col*ac*0.06;

    fragColor=vec4(finalCol,1.0);

    // Preserve the original shader's depth-based alpha behaviour,
    // while the canvas itself remains opaque.
    fragColor.w=1.0-depth*0.1;
}

void main(){
    mainImage(gl_FragColor,gl_FragCoord.xy);
}
`;

function shader(type,src){
    const s=gl.createShader(type);
    gl.shaderSource(s,src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){
        throw new Error(gl.getShaderInfoLog(s));
    }
    return s;
}

const program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(program));

const buffer=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
    -1,-1, 3,-1, -1,3
]),gl.STATIC_DRAW);

const position=gl.getAttribLocation(program,"position");
const resolution=gl.getUniformLocation(program,"iResolution");
const time=gl.getUniformLocation(program,"iTime");

gl.useProgram(program);
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position,2,gl.FLOAT,false,0,0);

function resize(){
    const dpr=Math.min(devicePixelRatio||1,2);
    const w=Math.max(1,Math.floor(innerWidth*dpr));
    const h=Math.max(1,Math.floor(innerHeight*dpr));
    if(canvas.width!==w||canvas.height!==h){
        canvas.width=w; canvas.height=h;
    }
    gl.viewport(0,0,w,h);
}
addEventListener("resize",resize,{passive:true});

const start=performance.now();
function frame(now){
    resize();
    gl.uniform2f(resolution,canvas.width,canvas.height);
    gl.uniform1f(time,(now-start)/1000);
    gl.drawArrays(gl.TRIANGLES,0,3);
    requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
